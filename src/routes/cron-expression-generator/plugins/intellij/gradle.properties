# The platform already ships kotlin-stdlib. Bundling a second copy is the most
# common cause of "plugin fails to load" reports, so we opt out of it.
kotlin.stdlib.default.dependency=false

# Building against a full IDE distribution is memory-hungry; the default heap
# is not enough and fails with an opaque OOM part-way through.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

org.gradle.caching=true
org.gradle.parallel=true
