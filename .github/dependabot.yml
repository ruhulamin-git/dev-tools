version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Editor/lint/format/test tooling rarely needs individual review — batch it into one PR.
      dev-dependencies:
        dependency-type: 'development'
    open-pull-requests-limit: 10

  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
