server {
  # 8080, not 80: the runtime image (nginxinc/nginx-unprivileged) runs as a non-root user, which
  # can't bind a port below 1024.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hide nginx version for security
  server_tokens off;

  # Error and access logs
  error_log /var/log/nginx/error.log warn;
  access_log /var/log/nginx/access.log combined;

  # Gzip compression for better performance
  gzip on;
  # Serve the .gz file the build already generated (svelte.config.js's adapter `precompress`)
  # instead of spending CPU compressing the same asset again on every request. Confirmed
  # available in this image: `nginx -V` lists --with-http_gzip_static_module.
  # The build also emits .br (Brotli, smaller than gzip) alongside every asset, but the stock
  # nginx:alpine image has no Brotli module (`ngx_brotli`) to serve them with `brotli_static`;
  # they're unused until/unless the base image changes to one that includes it.
  gzip_static on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml+rss
  application/atom+xml
  application/wasm
  image/svg+xml;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header X-Download-Options "noopen" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # Content Security Policy (CSP) - Effective against XSS attacks
  # Note: SvelteKit uses inline scripts for hydration, so we need 'unsafe-inline' for scripts
  # connect-src includes wss: so Socket.IO can upgrade to secure WebSockets (e.g. the
  # Quran Khatmah backend); plain https: only covers the polling transport.
  #
  # script-src explicitly allows googletagmanager.com — this was missing entirely before, which
  # is a real bug, not a hardening gap: without it, the browser blocks GTM's own gtm.js from
  # loading at all under this *enforced* policy, silently breaking every GTM-based analytics
  # event on the whole site. Confirmed with a `securitypolicyviolation` listener against a live
  # container running this exact file before this fix: "Loading the script
  # 'https://www.googletagmanager.com/gtm.js?id=GTM-KWQHD5N' violates ... The action has been
  # blocked", disposition "enforce" — i.e. this was already happening in production, not just a
  # theoretical risk.
  #
  # That same check also surfaced something this file deliberately does NOT fix: the GTM
  # container is configured to load three more third-party scripts once gtm.js itself runs —
  # assets.apollo.io's website tracker, snap.licdn.com's LinkedIn Insight Tag, and
  # connect.facebook.net's Meta/Facebook Pixel — all still blocked, under both policies, because
  # neither allows those hosts either. That's the actual cause of the "[Meta pixel] ... is
  # unavailable" console warning this app has been logging on every page. Unlike gtm.js itself
  # (unambiguously supposed to load — the site embeds it directly in app.html), whether these
  # three specifically SHOULD be unblocked is a product/legal call, not an engineering one: they
  # are cross-site ad-retargeting and lead-scoring pixels, materially more invasive than the
  # "analytics to see which tools are useful" the consent banner (ConsentBanner.svelte) discloses
  # — unblocking them without updating that disclosure would make the banner inaccurate. Left
  # blocked here; whoever owns the GTM container and the privacy policy should decide whether to
  # add them (and update the consent copy to match) or remove those tags from the container.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

  # Report-Only: the same policy, minus 'unsafe-eval' — observe-only, changes nothing yet. Every
  # browser that visits logs a console warning (and would send a violation report, if report-uri/
  # report-to were configured, which needs an external collector this repo doesn't have) for
  # anything that would break if 'unsafe-eval' were actually removed above, without breaking it
  # for real first. connect-src/style-src/font-src are left exactly as enforced above: Khatmah's
  # backend URL is a per-deployment env var this static nginx.conf can't know, and the Google
  # Fonts allowances are still genuinely needed by two routes (daily-islamic-messages,
  # quran-khatmah-tracker) that load their own font families independently of the app's main,
  # already-self-hosted fonts — narrowing either safely needs more than this file can verify.
  #
  # Checked against a live container running this file, using a `securitypolicyviolation`
  # listener (not just reading the header) across the home page and the three tool pages most
  # likely to need eval-like behavior (cron-expression-generator/cron-parser,
  # online-markdown-editor's PDF export/html2pdf.js, free-invoice-generator/jsPDF) plus
  # hash-generator's Web Worker and qr-code-generator/json-formatter-validator: no
  # `unsafe-eval`-related violation on any of them (the only violations logged are the three
  # already-blocked GTM sub-tags noted above, present identically under the enforced policy, so
  # they're not evidence against removing 'unsafe-eval') — nothing observed so far would break if
  # it were actually removed, though this exercised each page's initial load rather than every
  # interactive path (e.g. it didn't click through to an actual PDF download).
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

  # HTTP Strict Transport Security (HSTS) - Strong policy
  # max-age=31536000 = 1 year, includeSubDomains, preload
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Cross-Origin-Opener-Policy (COOP) - Proper origin isolation
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Cross-Origin-Embedder-Policy (COEP) - Enhances isolation with COOP
  # Using 'credentialless' for better compatibility while maintaining security
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # Trusted Types - Mitigate DOM-based XSS
  # This enables Trusted Types API which prevents dangerous DOM operations
  add_header Require-Trusted-Types-For "'script'" always;

  # Health check endpoint (no logging)
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Content-hashed build assets — the filename changes whenever the content does,
  # so they are safe to cache forever. (Longer prefix than the block below, so it
  # wins for these URLs.)
  location ^~ /tools/_app/immutable/ {
    alias /usr/share/nginx/html/_app/immutable/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
  }

  # Other _app/ files (env.js, version.json) have STABLE names but their contents
  # change every deploy — env.js is where PUBLIC_KHATMAH_BACKEND_URL is baked in.
  # They must always revalidate; caching them as immutable made Safari serve a
  # stale empty env.js, so Socket.IO fell back to same-origin (www.devxhub.com).
  location ^~ /tools/_app/ {
    alias /usr/share/nginx/html/_app/;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Vary "Accept-Encoding";
  }

  location ^~ /tools/ {
    alias /usr/share/nginx/html/;

    # Handle SPA routing - serve 200.html for non-file requests
    try_files $uri $uri.html /200.html;
  }

  # Handle SPA routing for root (if accessed without /tools)
  location / {
    try_files $uri $uri.html /200.html;
  }

  # Cache static assets aggressively (for root-level assets if any)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    try_files $uri =404;
  }

  # Cache HTML files for a short time (in case of updates)
  location ~* \.(html)$ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
    add_header Vary "Accept-Encoding";
    try_files $uri $uri/ /index.html;
  }

  # Cache JSON files briefly
  location ~* \.(json)$ {
    expires 1h;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    try_files $uri =404;
  }

  # Handle manifest files
  location ~* \.(webmanifest|manifest\.json)$ {
    expires 1d;
    add_header Cache-Control "public";
    add_header Content-Type "application/manifest+json";
    try_files $uri =404;
  }

  # API proxy (if your SPA needs to proxy API calls)
  # Uncomment and adjust if needed
  # location /api/ {
  #     proxy_pass http://your-api-server;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  # }

  # Deny access to hidden files and directories
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Deny access to backup and temp files
  location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
  }
}
